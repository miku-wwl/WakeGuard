name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run JVM tests, lint and APK builds
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Generate and verify APK checksums
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-{x86_64,arm64-v8a}-debug.apk | tee SHA256SUMS
          sha256sum --check SHA256SUMS
          for apk in app-{x86_64,arm64-v8a}-debug.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wakeguard-experimental-build-and-checks
          path: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          retention-days: 14

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      model_gate: ${{ steps.lightweight_model.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the official API 36 Google APIs image
        run: |
          mkdir -p ci-evidence
          # KVM access is scoped to this disposable GitHub-hosted runner.
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses
          "$sdk/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/wakeguard-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$sdk/avdmanager" create avd -n WakeGuard_API36 \
            -k 'system-images;android-36;google_apis;x86_64' --device pixel_7 \
            -p "$ANDROID_AVD_HOME/WakeGuard_API36.avd" </dev/null 2>&1 | tee ci-evidence/avd-create.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee ci-evidence/avds.txt
          test -s "$ANDROID_AVD_HOME/WakeGuard_API36.avd/config.ini"
          grep -Fxq WakeGuard_API36 ci-evidence/avds.txt
      - name: Boot emulator
        id: boot
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee ci-evidence/acceleration.txt
          "$ANDROID_HOME/emulator/emulator" -avd WakeGuard_API36 -no-window -no-snapshot -no-boot-anim \
            -gpu swiftshader -feature -Vulkan -camera-back emulated -camera-front none \
            >ci-evidence/emulator.log 2>&1 &
          emulator_pid=$!
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          boot_deadline=$((SECONDS + 300))
          until [[ "$(timeout 5 "$adb_bin" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              tail -n 120 ci-evidence/emulator.log
              exit 1
            fi
            sleep 2
          done
          "$adb_bin" devices -l | tee ci-evidence/devices.txt
          "$adb_bin" shell input keyevent 224
          "$adb_bin" shell wm dismiss-keyguard
          "$adb_bin" shell settings put global window_animation_scale 0
          "$adb_bin" shell settings put global transition_animation_scale 0
          "$adb_bin" shell settings put global animator_duration_scale 0
      - name: Run Android functional regression on API 36
        id: functional
        run: |
          chmod +x gradlew
          ./gradlew connectedDebugAndroidTest --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest
      - name: Save functional evidence
        if: always() && steps.boot.outcome == 'success'
        run: |
          if [[ -d app/build/outputs/androidTest-results/connected/debug ]]; then
            cp -r app/build/outputs/androidTest-results/connected/debug ci-evidence/functional
          fi
          if [[ "${{ steps.functional.outcome }}" != 'success' ]]; then
            adb exec-out screencap -p > ci-evidence/functional-post-run.png || true
          fi
      - name: Install debug APK on the disposable AVD for task-removal test
        if: always() && steps.functional.outcome == 'success'
        run: adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
      - name: Run Round 4 Recents task-removal regression
        id: task_removal
        if: always() && steps.functional.outcome == 'success'
        run: |
          mkdir -p ci-evidence/task-removal
          python3 tools/round4/emulator_task_removal_e2e.py \
            --serial emulator-5554 \
            --evidence ci-evidence/task-removal
      - name: Enforce lightweight policy with production models
        if: always() && steps.boot.outcome == 'success'
        id: lightweight_model
        continue-on-error: true
        run: |
          ./gradlew connectedDebugAndroidTest --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.class=com.mikuwwl.wakeguard.RealVisionAcceptanceTest
      - name: Save lightweight model evidence and historical diagnostic
        if: always() && steps.boot.outcome == 'success'
        run: |
          if [[ -d app/build/outputs/androidTest-results/connected/debug ]]; then
            cp -r app/build/outputs/androidTest-results/connected/debug ci-evidence/lightweight-model
          fi
          adb logcat -d -s WakeGuardPolicy:I WakeGuardVision:I WakeGuardAlarm:I WakeGuardRestore:I AndroidRuntime:E > ci-evidence/model-and-alarm-logcat.txt
          python3 tools/round3/collect_policy_logcat.py ci-evidence/model-and-alarm-logcat.txt ci-evidence/vision-policy-results.json --allow-missing
          if [[ "${{ steps.lightweight_model.outcome }}" != 'success' ]]; then
            adb exec-out screencap -p > ci-evidence/lightweight-model-post-run.png || true
          fi
      - name: Record historical strict gate as diagnostic only
        if: always() && steps.boot.outcome == 'success'
        id: historical_strict
        continue-on-error: true
        run: |
          ./gradlew connectedDebugAndroidTest --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.class=com.mikuwwl.wakeguard.HistoricalStrictVisionDiagnosticTest
      - name: Save historical strict diagnostic evidence
        if: always() && steps.boot.outcome == 'success'
        run: |
          if [[ -d app/build/outputs/androidTest-results/connected/debug ]]; then
            cp -r app/build/outputs/androidTest-results/connected/debug ci-evidence/historical-strict-diagnostic
          fi
          adb logcat -d -s WakeGuardFixture:I AndroidRuntime:E > ci-evidence/historical-strict-logcat.txt
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wakeguard-api36-evidence
          path: ci-evidence
          retention-days: 14

  real-vision-gate:
    needs: [verify, emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require functional CI and genuine model assertions
        env:
          BUILD: ${{ needs.verify.result }}
          EMULATOR: ${{ needs.emulator.result }}
          MODEL: ${{ needs.emulator.outputs.model_gate }}
        run: |
          echo "Build=$BUILD emulator=$EMULATOR model=$MODEL"
          if [[ "$BUILD" != 'success' || "$EMULATOR" != 'success' || "$MODEL" != 'success' ]]; then
            echo '::error::The functional and production-model gates must pass. Read the emulator evidence before release.'
            exit 1
          fi
          echo 'Product-aligned lightweight vision gate passed. The historical strict benchmark is diagnostic only; local real CameraX end-to-end acceptance remains separately required.'
